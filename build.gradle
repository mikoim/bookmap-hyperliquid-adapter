import java.io.DataInputStream

plugins {
    id 'java'
    id 'eclipse'
    id 'checkstyle'
    id 'com.diffplug.spotless' version '8.10.1'
    id 'com.github.spotbugs' version '6.5.6'
}

group = 'com.bookmap.api.adapter'
version = '1.3.0'

int buildJdk = Integer.parseInt(JavaVersion.current().majorVersion)
if (buildJdk < 21 || buildJdk > 25) {
    throw new GradleException("This build requires JDK 21 through JDK 25; found JDK $buildJdk")
}

repositories {
    mavenCentral()
    maven { url = uri('https://maven.bookmap.com/maven2/releases/') }
}

dependencies {
    compileOnly 'com.bookmap.api:api-core:7.8.0.13'
    compileOnly 'com.google.code.gson:gson:2.4'
    compileOnly 'org.eclipse.jetty.aggregate:jetty-all:9.3.8.v20160314'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.bookmap.api:api-core:7.8.0.13'
    testImplementation 'com.google.code.gson:gson:2.4'
    testImplementation 'org.eclipse.jetty.aggregate:jetty-all:9.3.8.v20160314'
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.release = 8
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.30.0')
    }
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    maxErrors = 0
    ignoreFailures = false
}

spotbugs {
    toolVersion = '4.10.2'
    effort = com.github.spotbugs.snom.Effort.MAX
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    ignoreFailures = false
    runOnCheck = true
    reportsDir = file("$buildDir/reports/spotbugs")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    excludeFilter = file('config/spotbugs/exclude.xml')
    reports {
        html.required = true
        xml.required = true
    }
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.register('verifyJava8Bytecode') {
    dependsOn tasks.named('classes'), tasks.named('testClasses')
    doLast {
        fileTree(layout.buildDirectory.dir('classes').get().asFile).matching { include '**/*.class' }.files.each { classFile ->
            classFile.withInputStream { input ->
                DataInputStream data = new DataInputStream(input)
                if (data.readInt() != (int) 0xCAFEBABE) {
                    throw new GradleException("Invalid class file: $classFile")
                }
                data.readUnsignedShort()
                int major = data.readUnsignedShort()
                if (major != 52) {
                    throw new GradleException("Expected Java 8 major 52 but found $major in $classFile")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('checkstyleMain')
    dependsOn tasks.named('checkstyleTest')
    dependsOn tasks.named('spotbugsMain')
    dependsOn tasks.named('verifyJava8Bytecode')
}

tasks.named('jar') {
    dependsOn tasks.named('check')
    archiveBaseName = 'hyperliquid-adapter'
}
